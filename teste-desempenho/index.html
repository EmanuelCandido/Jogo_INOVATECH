      <p class="loading-signature">CADA ESCOLHA DEIXA UMA MARCA.</p>
    </section>
    <div id="root"></div>
    <script>
      // ?diagnostico=1 only: main-thread stalls during the opening, for the phone report.
      if (/[?&]diagnostico=1/.test(location.search) && window.PerformanceObserver) {
        window.ecoLongTasks = [];
        try { new PerformanceObserver(function (list) { list.getEntries().forEach(function (e) { window.ecoLongTasks.push({ start: e.startTime, duration: e.duration }); }); }).observe({ type: 'longtask', buffered: true }); } catch (e) {}
      }
    </script>
    <script>
      // A failed game bundle cannot mount React's error boundary.
      window.addEventListener('error', function (event) {
        if (event.target instanceof HTMLScriptElement && event.target.type === 'module') {
          var screen = document.getElementById('game-loading');
          screen.dataset.state = 'error';
          screen.setAttribute('aria-busy', 'false');
        }
      }, true);
    </script>
    <script>
      // Rotating construction notes while the bundle downloads; stops once hidden.
      (function () {
        var caption = document.querySelector('.loading-caption'), tips = caption.dataset.tips.split('|'), index = -1;
        var timer = setInterval(function () {
          var screen = document.getElementById('game-loading');
          if (screen.hidden || screen.dataset.state !== 'loading') return clearInterval(timer);
          index = (index + 1) % tips.length;
          caption.classList.remove('loading-tip'); void caption.offsetWidth;
          caption.textContent = tips[index]; caption.classList.add('loading-tip');
        }, 2400);
      })();
    </script>
    <noscript><style>.loading-copy { display: none; }</style><p class="loading-no-script">Ative o JavaScript no navegador para jogar Eco City.</p></noscript>
  </body>
</html>
